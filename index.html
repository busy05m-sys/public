<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>KISEJA TENANTS — Portal ya Mpangaji</title>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore-compat.js"></script>

<style>
:root {
  --teal: #0A6E6E;
  --teal2: #0D8F8F;
  --teal-l: #E0F0EE;
  --teal-ll: #F0FBF9;
  --gold: #B8870B;
  --gold-l: #FBF3DC;
  --rd: #C0392B;
  --rd-l: #FDECEA;
  --gr: #1A6B3A;
  --gr-l: #E4F5EA;
  --ink: #0F1923;
  --grey: #6B7280;
  --border: #E2E8F0;
  --paper: #F7FAFA;
  --white: #fff;
  --mono: 'Courier New', monospace;
  --sans: system-ui, -apple-system, sans-serif;
  --sh: 0 2px 12px rgba(10,110,110,.10);
  --sh2: 0 8px 32px rgba(10,110,110,.15);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; font-family: var(--sans); background: var(--paper); color: var(--ink); font-size: 15px; }

/* ── SCREENS ── */
.screen { display: none; min-height: 100vh; }
.screen.active { display: block; }

/* ── LOGIN ── */
#s-login {
  display: none;
  min-height: 100vh;
  background: linear-gradient(145deg, #0A6E6E 0%, #0D8F8F 60%, #0A7A6E 100%);
  align-items: center;
  justify-content: center;
  padding: 20px;
  flex-direction: column;
}
#s-login.active { display: flex; }

.login-card {
  background: var(--white);
  border-radius: 20px;
  padding: 36px 32px;
  max-width: 380px;
  width: 100%;
  box-shadow: 0 20px 60px rgba(0,0,0,.20);
}
.login-logo {
  text-align: center;
  margin-bottom: 28px;
}
.login-logo-circle {
  width: 68px; height: 68px;
  background: linear-gradient(135deg, var(--teal), var(--teal2));
  border-radius: 50%;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 1.8rem;
  margin-bottom: 12px;
  box-shadow: 0 4px 16px rgba(10,110,110,.3);
}
.login-title { font-size: 1.25rem; font-weight: 800; color: var(--ink); }
.login-sub { font-size: .82rem; color: var(--grey); margin-top: 4px; }

.lbl { font-size: .72rem; font-weight: 700; color: var(--grey); text-transform: uppercase; letter-spacing: .06em; display: block; margin-bottom: 6px; }
.inp {
  width: 100%; border: 2px solid var(--border); border-radius: 10px;
  padding: 13px 14px; font-size: .95rem; font-family: var(--sans);
  outline: none; transition: .2s; background: var(--paper);
}
.inp:focus { border-color: var(--teal); background: var(--white); box-shadow: 0 0 0 4px rgba(10,110,110,.10); }
.inp-group { margin-bottom: 18px; }

.btn-main {
  width: 100%; background: linear-gradient(135deg, var(--teal), var(--teal2));
  color: #fff; border: none; border-radius: 10px;
  padding: 14px; font-size: 1rem; font-weight: 700;
  cursor: pointer; font-family: var(--sans);
  box-shadow: 0 4px 16px rgba(10,110,110,.3);
  transition: .2s; letter-spacing: .02em;
}
.btn-main:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(10,110,110,.35); }
.btn-main:active { transform: translateY(0); }
.btn-main:disabled { opacity: .6; cursor: not-allowed; transform: none; }

.login-err {
  background: var(--rd-l); color: var(--rd);
  border-left: 3px solid var(--rd);
  border-radius: 8px; padding: 10px 14px;
  font-size: .82rem; margin-top: 14px;
  display: none;
}
.login-hint { text-align: center; font-size: .78rem; color: var(--grey); margin-top: 18px; }

/* ── APP SHELL ── */
#s-app {
  display: none;
  flex-direction: column;
  min-height: 100vh;
}
#s-app.active { display: flex; }

/* Top bar */
.topbar {
  background: linear-gradient(135deg, #0A6E6E, #0D8F8F);
  padding: 0 18px;
  height: 58px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky; top: 0; z-index: 100;
  box-shadow: 0 2px 12px rgba(0,0,0,.15);
}
.tb-left { display: flex; align-items: center; gap: 10px; }
.tb-icon { font-size: 1.4rem; }
.tb-name { font-size: .82rem; font-weight: 700; color: #fff; line-height: 1.2; }
.tb-id { font-size: .68rem; color: rgba(255,255,255,.6); }
.tb-logout {
  background: rgba(255,255,255,.15); border: 1px solid rgba(255,255,255,.25);
  color: #fff; border-radius: 8px; padding: 6px 12px;
  font-size: .75rem; font-weight: 600; cursor: pointer; font-family: var(--sans);
}

/* Bottom nav */
.bottom-nav {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: var(--white);
  border-top: 1px solid var(--border);
  display: grid; grid-template-columns: repeat(4, 1fr);
  z-index: 100;
  box-shadow: 0 -4px 16px rgba(0,0,0,.06);
}
.nav-btn {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 10px 4px 12px;
  cursor: pointer; transition: .15s;
  border: none; background: none; font-family: var(--sans);
  color: var(--grey); gap: 3px;
}
.nav-btn .nav-icon { font-size: 1.35rem; }
.nav-btn .nav-lbl { font-size: .62rem; font-weight: 600; letter-spacing: .03em; }
.nav-btn.active { color: var(--teal); }
.nav-btn.active .nav-lbl { color: var(--teal); }
.nav-badge {
  position: absolute; top: 6px; right: calc(50% - 18px);
  background: var(--rd); color: #fff;
  border-radius: 10px; padding: 1px 5px; font-size: .58rem; font-weight: 700;
}
.nav-btn { position: relative; }

/* Main content */
.main { flex: 1; padding: 16px 16px 88px; max-width: 520px; margin: 0 auto; width: 100%; }

/* Pages */
.page { display: none; }
.page.active { display: block; animation: fi .2s ease; }
@keyframes fi { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* ── CARDS ── */
.card {
  background: var(--white);
  border-radius: 14px;
  box-shadow: var(--sh);
  margin-bottom: 14px;
  overflow: hidden;
}
.card-hd {
  padding: 14px 18px;
  border-bottom: 1px solid var(--border);
  font-size: .8rem; font-weight: 700; color: var(--teal);
  display: flex; justify-content: space-between; align-items: center;
}
.card-body { padding: 16px 18px; }

/* Status banner */
.status-banner {
  border-radius: 14px;
  padding: 20px 20px;
  margin-bottom: 16px;
  display: flex; flex-direction: column; gap: 10px;
  position: relative; overflow: hidden;
}
.status-banner.ok { background: linear-gradient(135deg, var(--teal), var(--teal2)); color: #fff; }
.status-banner.warn { background: linear-gradient(135deg, #B8870B, #D4A017); color: #fff; }
.status-banner.danger { background: linear-gradient(135deg, #C0392B, #E74C3C); color: #fff; }
.sb-name { font-size: 1rem; font-weight: 700; }
.sb-nyumba { font-size: .8rem; opacity: .8; margin-top: 2px; }
.sb-days { font-size: 2.2rem; font-weight: 800; line-height: 1; }
.sb-days-lbl { font-size: .75rem; opacity: .8; }
.sb-gold { position: absolute; top: 0; right: 0; bottom: 0; width: 4px; background: rgba(255,255,255,.3); }

/* Info rows */
.info-row {
  display: flex; justify-content: space-between; align-items: center;
  padding: 10px 0; border-bottom: 1px solid var(--border);
}
.info-row:last-child { border-bottom: none; }
.ir-key { font-size: .75rem; color: var(--grey); font-weight: 600; }
.ir-val { font-size: .82rem; font-weight: 700; text-align: right; }

/* Badges */
.badge {
  display: inline-block; padding: 3px 9px; border-radius: 20px;
  font-size: .68rem; font-weight: 700;
}
.b-ok { background: var(--gr-l); color: var(--gr); }
.b-warn { background: var(--gold-l); color: var(--gold); }
.b-err { background: var(--rd-l); color: var(--rd); }
.b-blue { background: var(--teal-l); color: var(--teal); }

/* Payment items */
.pay-item {
  display: flex; justify-content: space-between; align-items: flex-start;
  padding: 14px 0; border-bottom: 1px solid var(--border);
  gap: 10px;
}
.pay-item:last-child { border-bottom: none; }
.pi-left { flex: 1; }
.pi-risiti { font-family: var(--mono); font-size: .78rem; font-weight: 700; color: var(--teal); }
.pi-date { font-size: .72rem; color: var(--grey); margin-top: 2px; }
.pi-kipindi { font-size: .72rem; color: var(--grey); }
.pi-right { text-align: right; }
.pi-amount { font-size: .9rem; font-weight: 800; color: var(--gr); font-family: var(--mono); }
.pi-njia { font-size: .7rem; color: var(--grey); margin-top: 2px; }

/* KPI mini */
.kpi-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
.kpi-mini {
  background: var(--white); border-radius: 12px;
  padding: 14px 16px; box-shadow: var(--sh);
  border-top: 3px solid var(--teal);
}
.km-lbl { font-size: .65rem; color: var(--grey); font-weight: 600; text-transform: uppercase; letter-spacing: .06em; margin-bottom: 5px; }
.km-val { font-family: var(--mono); font-size: 1.3rem; font-weight: 700; color: var(--ink); line-height: 1; }
.km-sub { font-size: .68rem; color: var(--grey); margin-top: 3px; }

/* Progress bar */
.progress-wrap { margin: 4px 0 12px; }
.progress-lbl { display: flex; justify-content: space-between; font-size: .7rem; color: var(--grey); margin-bottom: 5px; }
.progress-bar { height: 8px; background: var(--border); border-radius: 4px; overflow: hidden; }
.progress-fill { height: 100%; border-radius: 4px; background: linear-gradient(90deg, var(--teal), var(--teal2)); transition: width .5s ease; }

/* Message form */
.msg-item {
  display: flex; flex-direction: column; gap: 3px;
  padding: 12px 0; border-bottom: 1px solid var(--border);
}
.msg-item:last-child { border-bottom: none; }
.msg-from { font-size: .72rem; font-weight: 700; color: var(--teal); }
.msg-me { font-size: .72rem; font-weight: 700; color: var(--grey); }
.msg-text { font-size: .83rem; }
.msg-time { font-size: .67rem; color: var(--grey); }
.msg-bubble {
  padding: 12px 14px; border-radius: 12px;
  font-size: .83rem; line-height: 1.5; max-width: 88%;
}
.msg-bubble.sent { background: var(--teal); color: #fff; align-self: flex-end; border-radius: 12px 12px 2px 12px; }
.msg-bubble.recv { background: var(--white); border: 1px solid var(--border); align-self: flex-start; border-radius: 12px 12px 12px 2px; }
.msg-row { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
.msg-meta { font-size: .65rem; color: var(--grey); }
.msg-meta.sent { text-align: right; }

/* Section title */
.sec-title { font-size: .7rem; font-weight: 700; color: var(--grey); text-transform: uppercase; letter-spacing: .07em; margin: 16px 0 10px; }

/* Empty state */
.empty { text-align: center; padding: 36px 20px; color: var(--grey); font-size: .85rem; }
.empty-icon { font-size: 2.5rem; margin-bottom: 10px; }

/* Ujumbe textarea */
.msg-textarea {
  width: 100%; border: 2px solid var(--border); border-radius: 12px;
  padding: 12px 14px; font-size: .85rem; font-family: var(--sans);
  resize: none; outline: none; min-height: 80px; transition: .2s;
}
.msg-textarea:focus { border-color: var(--teal); box-shadow: 0 0 0 3px rgba(10,110,110,.08); }
.btn-send {
  background: linear-gradient(135deg, var(--teal), var(--teal2));
  color: #fff; border: none; border-radius: 10px;
  padding: 12px 24px; font-size: .85rem; font-weight: 700;
  cursor: pointer; font-family: var(--sans); margin-top: 10px;
  width: 100%; transition: .2s;
}
.btn-send:hover { opacity: .9; }
.btn-send:disabled { opacity: .5; }

/* Loading spinner */
.spinner {
  width: 32px; height: 32px; border: 3px solid var(--teal-l);
  border-top-color: var(--teal); border-radius: 50%;
  animation: spin .7s linear infinite; margin: 30px auto;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* Toast */
#toast {
  position: fixed; bottom: 88px; left: 50%; transform: translateX(-50%) translateY(20px);
  background: var(--ink); color: #fff; padding: 10px 20px;
  border-radius: 22px; font-size: .82rem; font-weight: 600;
  opacity: 0; transition: .3s; z-index: 999; white-space: nowrap;
  pointer-events: none;
}

/* Mkataba doc style */
.mk-section { margin-bottom: 16px; }
.mk-title {
  font-size: .68rem; font-weight: 700; text-transform: uppercase;
  letter-spacing: .07em; color: var(--teal); margin-bottom: 8px;
  padding-bottom: 5px; border-bottom: 2px solid var(--teal-l);
}
.mk-clause { font-size: .8rem; line-height: 1.65; color: var(--ink); margin-bottom: 6px; padding-left: 10px; border-left: 2px solid var(--teal-l); }
</style>
</head>
<body>

<!-- ══ SCREEN: LOGIN ══ -->
<div id="s-login" class="screen">
  <div class="login-card">
    <div class="login-logo">
      <div class="login-logo-circle">🏠</div>
      <div class="login-title">KISEJA TENANTS</div>
      <div class="login-sub">Portal ya Mpangaji</div>
    </div>

    <div class="inp-group">
      <label class="lbl" for="inp-id">Namba yako ya Mpangaji</label>
      <input class="inp" id="inp-id" type="text" placeholder="TEN-001"
        autocomplete="off" autocapitalize="characters" spellcheck="false"
        oninput="this.value=this.value.toUpperCase()">
    </div>
    <div class="inp-group" style="margin-bottom:22px">
      <label class="lbl" for="inp-pin">Namba ya Simu (uthibitisho)</label>
      <input class="inp" id="inp-pin" type="tel" placeholder="07xxxxxxxx" maxlength="12">
    </div>

    <button class="btn-main" id="btn-login" onclick="doLogin()">
      Ingia kwenye Akaunti Yangu →
    </button>

    <div class="login-err" id="login-err"></div>
    <div class="login-hint">Namba yako ya Mpangaji ipo kwenye mkataba wako.<br>Kwa msaada piga: <strong>+255 736 631 613</strong></div>
  </div>
</div>

<!-- ══ SCREEN: APP ══ -->
<div id="s-app" class="screen">

  <!-- Topbar -->
  <div class="topbar">
    <div class="tb-left">
      <div class="tb-icon">🏠</div>
      <div>
        <div class="tb-name" id="tb-name">—</div>
        <div class="tb-id" id="tb-id">—</div>
      </div>
    </div>
    <button class="tb-logout" onclick="doLogout()">Toka</button>
  </div>

  <!-- Main -->
  <div class="main">

    <!-- PAGE: DASHIBODI -->
    <div id="pg-dash" class="page active">
      <div id="dash-content"><div class="spinner"></div></div>
    </div>

    <!-- PAGE: MALIPO -->
    <div id="pg-malipo" class="page">
      <div class="sec-title">Historia ya Malipo Yangu</div>
      <div id="malipo-content"><div class="spinner"></div></div>
    </div>

    <!-- PAGE: MKATABA -->
    <div id="pg-mkataba" class="page">
      <div class="sec-title">Mkataba Wangu wa Upangaji</div>
      <div id="mkataba-content"><div class="spinner"></div></div>
    </div>

    <!-- PAGE: UJUMBE -->
    <div id="pg-ujumbe" class="page">
      <div class="sec-title">Mawasiliano na KISEJA</div>
      <div id="ujumbe-list"></div>
      <div class="card">
        <div class="card-body">
          <label class="lbl">Tuma Ujumbe Mpya</label>
          <textarea class="msg-textarea" id="msg-inp" placeholder="Andika ujumbe wako hapa... (swali, tatizo, ombi n.k.)"></textarea>
          <button class="btn-send" id="btn-send" onclick="sendMsg()">📨 Tuma Ujumbe</button>
        </div>
      </div>
    </div>

  </div><!-- /main -->

  <!-- Bottom nav -->
  <nav class="bottom-nav">
    <button class="nav-btn active" id="nav-dash" onclick="goPage('dash')">
      <span class="nav-icon">🏠</span>
      <span class="nav-lbl">Nyumbani</span>
    </button>
    <button class="nav-btn" id="nav-malipo" onclick="goPage('malipo')">
      <span class="nav-icon">💰</span>
      <span class="nav-lbl">Malipo</span>
    </button>
    <button class="nav-btn" id="nav-mkataba" onclick="goPage('mkataba')">
      <span class="nav-icon">📜</span>
      <span class="nav-lbl">Mkataba</span>
    </button>
    <button class="nav-btn" id="nav-ujumbe" onclick="goPage('ujumbe')">
      <span class="nav-icon">💬</span>
      <span class="nav-lbl">Ujumbe</span>
      <span class="nav-badge" id="msg-badge" style="display:none">!</span>
    </button>
  </nav>

</div><!-- /s-app -->

<div id="toast"></div>

<script>
// ══════════════════════════════════════
// FIREBASE CONFIG — BADILISHA HII NA YAKO
// ══════════════════════════════════════
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyBzaKMn7479kbHXAEOASzGZIc7FXZ0_g9U",
  authDomain: "kiseja-tenants.firebaseapp.com",
  projectId: "kiseja-tenants",
  storageBucket: "kiseja-tenants.firebasestorage.app",
  messagingSenderId: "1043089795963",
  appId: "1:1043089795963:web:586e08c0d50524679e2bde"
};

// ══════════════════════════════════════
// FIREBASE INIT
// ══════════════════════════════════════
firebase.initializeApp(FIREBASE_CONFIG);
const db = firebase.firestore();

// ══════════════════════════════════════
// STATE
// ══════════════════════════════════════
let TENANT = null;
let MALIPO = [];
let UJUMBE = [];
let unsubMsgs = null;

// ══════════════════════════════════════
// HELPERS
// ══════════════════════════════════════
function fmt(d) {
  if (!d) return '—';
  const x = d.toDate ? d.toDate() : new Date(d);
  if (isNaN(x)) return d;
  return x.toLocaleDateString('sw-TZ', {day:'2-digit', month:'2-digit', year:'numeric'});
}
function tzs(n) {
  if (n === undefined || n === null) return '—';
  return parseInt(n).toLocaleString();
}
function daysLeft(d) {
  if (!d) return 0;
  const x = d.toDate ? d.toDate() : new Date(d);
  return Math.floor((x - new Date()) / 86400000);
}
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.opacity = '1'; t.style.transform = 'translateX(-50%) translateY(0)';
  clearTimeout(t._t);
  t._t = setTimeout(() => { t.style.opacity = '0'; t.style.transform = 'translateX(-50%) translateY(20px)'; }, 3000);
}
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
function goPage(id) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('pg-' + id).classList.add('active');
  document.getElementById('nav-' + id).classList.add('active');
  if (id === 'dash') renderDash();
  if (id === 'malipo') renderMalipo();
  if (id === 'mkataba') renderMkataba();
  if (id === 'ujumbe') renderUjumbe();
}

// ══════════════════════════════════════
// LOGIN
// ══════════════════════════════════════
async function doLogin() {
  const tid = document.getElementById('inp-id').value.trim().toUpperCase();
  const simu = document.getElementById('inp-pin').value.trim();
  const btn = document.getElementById('btn-login');
  const err = document.getElementById('login-err');

  if (!tid || !simu) { showErr('Jaza ID na namba ya simu'); return; }
  if (!tid.match(/^TEN-\d{3}$/)) { showErr('ID lazima iwe kama TEN-001, TEN-002 n.k.'); return; }

  btn.disabled = true; btn.textContent = 'Inathibitisha...';
  err.style.display = 'none';

  try {
    const doc = await db.collection('wapangaji').doc(tid).get();
    if (!doc.exists) { showErr('ID ' + tid + ' haipatikani. Wasiliana na KISEJA.'); btn.disabled=false; btn.textContent='Ingia kwenye Akaunti Yangu →'; return; }

    const data = doc.data();
    // Check phone match (last 9 digits)
    const storedPhone = (data.simu || '').replace(/\D/g,'').slice(-9);
    const enteredPhone = simu.replace(/\D/g,'').slice(-9);
    if (storedPhone !== enteredPhone) {
      showErr('Namba ya simu haifanani. Jaribu tena au piga +255 736 631 613');
      btn.disabled=false; btn.textContent='Ingia kwenye Akaunti Yangu →';
      return;
    }

    TENANT = { id: tid, ...data };

    // Load malipo
    const mal = await db.collection('wapangaji').doc(tid).collection('malipo').orderBy('tarehe', 'desc').get();
    MALIPO = mal.docs.map(d => ({ na: d.id, ...d.data() }));

    // Save session
    sessionStorage.setItem('kiseja_tenant', JSON.stringify(TENANT));
    sessionStorage.setItem('kiseja_malipo', JSON.stringify(MALIPO));

    startApp();
  } catch(e) {
    showErr('Hitilafu: ' + e.message);
    btn.disabled=false; btn.textContent='Ingia kwenye Akaunti Yangu →';
  }
}

function showErr(msg) {
  const e = document.getElementById('login-err');
  e.textContent = msg; e.style.display = 'block';
}

function doLogout() {
  if (!confirm('Unataka kutoka?')) return;
  sessionStorage.clear();
  TENANT = null; MALIPO = []; UJUMBE = [];
  if (unsubMsgs) unsubMsgs();
  document.getElementById('inp-id').value = '';
  document.getElementById('inp-pin').value = '';
  showScreen('s-login');
}

// ══════════════════════════════════════
// DASHIBODI
// ══════════════════════════════════════
function renderDash() {
  const t = TENANT;
  const dl = daysLeft(t.kuisha);
  const bannerClass = dl > 30 ? 'ok' : dl > 0 ? 'warn' : 'danger';
  const dlText = dl > 0 ? dl + ' siku' : 'Imeisha';

  // Mkataba progress
  const startDate = t.kuingia?.toDate ? t.kuingia.toDate() : new Date(t.kuingia);
  const endDate = t.kuisha?.toDate ? t.kuisha.toDate() : new Date(t.kuisha);
  const totalDays = Math.max(1, (endDate - startDate) / 86400000);
  const passedDays = Math.max(0, (new Date() - startDate) / 86400000);
  const pct = Math.min(100, Math.round((passedDays / totalDays) * 100));

  document.getElementById('dash-content').innerHTML = `
    <div class="status-banner ${bannerClass}">
      <div>
        <div class="sb-name">${t.jina}</div>
        <div class="sb-nyumba">🏠 ${t.nyumba} — ${t.mkoa}</div>
      </div>
      <div style="text-align:right">
        <div class="sb-days">${dlText}</div>
        <div class="sb-days-lbl">${dl > 0 ? 'zimebaki kabla mkataba haujaisha' : 'Mkataba umeisha — wasiliana na KISEJA'}</div>
      </div>
      <div class="sb-gold"></div>
    </div>

    <div class="kpi-row">
      <div class="kpi-mini" style="border-top-color:var(--teal)">
        <div class="km-lbl">Pango/Mwezi</div>
        <div class="km-val">TZS ${(t.pango/1000).toFixed(0)}K</div>
        <div class="km-sub">${t.nyumba}</div>
      </div>
      <div class="kpi-mini" style="border-top-color:${deni>0?'var(--rd)':'var(--gr)'}">
        <div class="km-lbl">${deni > 0 ? 'Deni Lako' : 'Hali ya Malipo'}</div>
        <div class="km-val" style="color:${deni>0?'var(--rd)':'var(--gr)'}; font-size:${deni>0?'1rem':'1.3rem'}">
          ${deni > 0 ? 'TZS ' + tzs(deni) : '✓ Sawa'}
        </div>
        <div class="km-sub">${deni > 0 ? 'Tafadhali lipa' : 'Malipo yako yako sawa'}</div>
      </div>
    </div>

    <div class="card">
      <div class="card-hd">📅 Muda wa Mkataba</div>
      <div class="card-body">
        <div class="progress-lbl">
          <span>Kuingia: ${fmt(t.kuingia)}</span>
          <span>Kuisha: ${fmt(t.kuisha)}</span>
        </div>
        <div class="progress-wrap">
          <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
        </div>
        <div style="display:flex;justify-content:space-between;font-size:.72rem;color:var(--grey)">
          <span>Mkataba: miezi ${t.miezi}</span>
          <span>${pct}% imepita</span>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-hd">💰 Malipo ya Mwisho</div>
      <div class="card-body">
        ${lastPay ? `
          <div class="info-row"><span class="ir-key">Risiti</span><span class="ir-val" style="font-family:var(--mono);color:var(--teal)">${lastPay.risiti||'—'}</span></div>
          <div class="info-row"><span class="ir-key">Tarehe</span><span class="ir-val">${fmt(lastPay.tarehe)}</span></div>
          <div class="info-row"><span class="ir-key">Kilicholipwa</span><span class="ir-val" style="color:var(--gr)">TZS ${tzs(lastPay.kilipo)}</span></div>
          <div class="info-row"><span class="ir-key">Njia</span><span class="ir-val">${lastPay.njia||'—'}</span></div>
          <div class="info-row"><span class="ir-key">Mkataba Hadi</span><span class="ir-val">${fmt(lastPay.mpya)}</span></div>
        ` : '<div class="empty"><div class="empty-icon">💰</div>Hakuna malipo bado</div>'}
      </div>
    </div>

    <div class="card" style="background:var(--teal-ll);border:1px solid var(--teal-l)">
      <div class="card-body">
        <div style="font-size:.72rem;color:var(--teal);font-weight:700;margin-bottom:6px">📞 Wasiliana na KISEJA</div>
        <div style="font-size:.82rem;color:var(--ink)">Kwa maswali au tatizo lolote:</div>
        <div style="font-size:.9rem;font-weight:700;color:var(--teal);margin-top:6px">+255 736 631 613</div>
        <div style="font-size:.75rem;color:var(--grey);margin-top:2px">NMB: 60610028387 | Yass: 17517483</div>
      </div>
    </div>
  `;
}

  } else {
    html += MALIPO.map(p => `

          <div style="margin-top:4px"><span class="badge ${p.hali==='IMELIPWA'?'b-ok':p.hali==='SEHEMU'?'b-warn':'b-err'}">${p.hali||'—'}</span></div>
        </div>

          <div class="pi-amount">TZS ${tzs(p.kilipo)}</div>

          <div style="font-size:.68rem;color:var(--grey);margin-top:2px">Hadi: ${fmt(p.mpya)}</div>
        </div>
      </div>
    `).join('');
  }

  html += '</div></div>';
  document.getElementById('malipo-content').innerHTML = html;

// ══════════════════════════════════════
// UJUMBE — Real-time
// ══════════════════════════════════════
function listenMsgs() {
  if (!TENANT) return;
  if (unsubMsgs) unsubMsgs();
  unsubMsgs = db.collection('ujumbe')
    .where('tenant_id', '==', TENANT.id)
    .orderBy('wakati', 'asc')
    .onSnapshot(snap => {
      UJUMBE = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      // Badge
      const unread = UJUMBE.filter(m => m.kutoka === 'admin' && !m.soma);
      const badge = document.getElementById('msg-badge');
      if (badge) badge.style.display = unread.length > 0 ? '' : 'none';
      // Render if on page
      if (document.getElementById('pg-ujumbe').classList.contains('active')) renderUjumbe();
    }, () => {});
}

function renderUjumbe() {
  const listEl = document.getElementById('ujumbe-list');
  if (!listEl) return;

  // Mark admin messages as read
  UJUMBE.filter(m => m.kutoka === 'admin' && !m.soma).forEach(m => {
    db.collection('ujumbe').doc(m.id).update({ soma: true }).catch(()=>{});
  });

  if (UJUMBE.length === 0) {
    listEl.innerHTML = `<div class="empty"><div class="empty-icon">💬</div>Hakuna ujumbe bado.<br>Tuma ujumbe wako wa kwanza!</div>`;
    return;
  }

  listEl.innerHTML = '<div class="msg-row">' + UJUMBE.map(m => {
    const isMine = m.kutoka === 'tenant';
    const time = m.wakati?.toDate ? m.wakati.toDate().toLocaleString('sw-TZ',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}) : '—';
    return `
      <div>
        <div class="msg-bubble ${isMine ? 'sent' : 'recv'}">${m.maandishi}</div>
        <div class="msg-meta ${isMine ? 'sent' : ''}">${isMine ? 'Wewe' : 'KISEJA'} · ${time}</div>
      </div>
    `;
  }).join('') + '</div>';

  // Scroll to bottom
  setTimeout(() => { listEl.scrollTop = listEl.scrollHeight; }, 100);
}

async function sendMsg() {
  const inp = document.getElementById('msg-inp');
  const btn = document.getElementById('btn-send');
  const text = inp.value.trim();
  if (!text) { toast('Andika ujumbe kwanza'); return; }

  btn.disabled = true; btn.textContent = 'Inatuma...';
  try {
    await db.collection('ujumbe').add({
      tenant_id: TENANT.id,
      jina: TENANT.jina,
      nyumba: TENANT.nyumba,
      maandishi: text,
      kutoka: 'tenant',
      wakati: firebase.firestore.FieldValue.serverTimestamp(),
      soma: false
    });
    inp.value = '';
    toast('✓ Ujumbe umetumwa');
  } catch(e) {
    toast('❌ Hitilafu: ' + e.message);
  }
  btn.disabled = false; btn.textContent = '📨 Tuma Ujumbe';
}

// ══════════════════════════════════════
// SESSION RESTORE
// ══════════════════════════════════════
window.addEventListener('load', () => {
  const saved = sessionStorage.getItem('kiseja_tenant');
  const savedMal = sessionStorage.getItem('kiseja_malipo');
  if (saved) {
    try {
      TENANT = JSON.parse(saved);
      MALIPO = savedMal ? JSON.parse(savedMal) : [];
      startApp();
      return;
    } catch(e) {}
  }
  showScreen('s-login');

  // Enter key on login
  document.getElementById('inp-pin').addEventListener('keydown', e => {
    if (e.key === 'Enter') doLogin();
  });
});
